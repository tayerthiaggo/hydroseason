# Conda environment for a source checkout. The geospatial native stack comes
# from conda-forge; pip then installs HydroSeason with every optional extra.
#   conda env create -f environment.yml
name: hydroseason
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gdal>=3.11
  - rasterio>=1.4
  - geopandas>=0.14
  - shapely>=2.0
  - jupyter
  - pip
  - pip:
      - -e ".[all,dev]"
