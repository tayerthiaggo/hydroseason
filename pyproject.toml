[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroseason"
version = "0.1.0"
description = "Remote-sensing-first hydro-year detection from monthly surface-water extent"
readme = "README.md"
# Upper bound is deliberate, not conservatism-by-default: the raster/stac
# extras pull native wheels (rasterio, GDAL, h5py, and user-installed
# backends such as netCDF4) whose ABI must
# match the installed NumPy. On Python 3.14 that combination emitted
# "numpy.ndarray size changed, may indicate binary incompatibility" at
# import in the field; the reproduction did not prove it caused the reported
# kernel death. Lift this cap only after the 3.14 CI matrices are green.
requires-python = ">=3.10,<3.14"
authors = [
  { name = "Thiaggo C. Tayer", email = "thiaggo.tayer@uwa.edu.au" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "hydrology",
  "hydrological-year",
  "remote-sensing",
  "surface-water",
  "water-mask",
  "water-resources",
  "geospatial"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24"
]

[project.optional-dependencies]
raster = [
  "xarray>=2023.8",
  "rioxarray>=0.15",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "affine>=2.4",
  "dask[array]>=2024.1",
  "zarr>=2.16,<3",
  "h5netcdf>=1.3",
  "h5py>=3.10",
  "s3fs>=2024.6"
]
stac = [
  "hydroseason[raster]",
  # DEA serves STAC Projection extension v2.0 (`proj:code`, which replaced
  # `proj:epsg`). pystac gained support for it in 1.12.0; older pystac reads
  # those items as having no CRS and odc-stac then fails the whole load with
  # "The asset must have the following fields (from the projection
  # extension): shape, transform, and one of an epsg, wkt2, or projjson".
  # Pinned directly rather than left to pystac-client/odc-stac's looser
  # transitive floors, which happily resolve 1.10.
  "pystac>=1.12",
  "pystac-client>=0.8",
  "odc-stac>=0.5",
  "tqdm>=4.65"
]
all = [
  "hydroseason[raster,stac]"
]
case-study = [
  "hydroseason[stac]",
  "psutil>=5.9",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12,<1",
  "build>=1.2",
  "twine>=6.1",
  "check-wheel-contents>=0.6",
  "tomli>=2.0; python_version < '3.11'",
  "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/tayerthiaggo/hydroseason"
Documentation = "https://tayerthiaggo.github.io/hydroseason/"
Repository = "https://github.com/tayerthiaggo/hydroseason"
Issues = "https://github.com/tayerthiaggo/hydroseason/issues"
Changelog = "https://github.com/tayerthiaggo/hydroseason/blob/main/CHANGELOG.md"

[project.scripts]
hydroseason = "hydroseason.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
hydroseason = ["_assets/*.js", "_assets/*.css", "_assets/*.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hydroseason*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The promotion-gate harness is documented as "intentionally allowed to fail"
# and must never block a release, but declaring the marker alone did not stop
# it running. Exclude it by default; run it deliberately with `-m experimental`.
addopts = ["-m", "not experimental"]
markers = [
  "slow: integration or data-backed checks",
  "experimental: promotion-gate comparison, may fail without blocking release",
  "network: requires external DEA/STAC access",
  "performance: opt-in wall-clock performance gate",
]

[tool.coverage.run]
# Core CI runs without optional raster/STAC dependencies. Those modules are
# exercised by the all-extras job instead of lowering the pandas-only gate.
omit = [
  "hydroseason/_historical_water_mask.py",
  "hydroseason/_io_dea_stats.py",
  "hydroseason/_io_extent_cache.py",
  "hydroseason/_io_geo.py",
  "hydroseason/_io_resolution.py",
  "hydroseason/_io_stac_cache.py",
  "hydroseason/_io_wofs_acquire.py",
  "hydroseason/_io_wofs_coarsen.py",
  "hydroseason/_io_wofs_compare.py",
  "hydroseason/_io_wofs_zarr.py",
  "hydroseason/_report_svg.py",
  "hydroseason/_spatial_plan.py",
  "hydroseason/_study_aois.py",
  "hydroseason/_wet_aoi.py",
  "hydroseason/io.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
