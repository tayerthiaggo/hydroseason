[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroseason"
version = "0.1.0"
description = "Rainfall-based hydrological wet/dry season and hydrological-year delineation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Thiaggo Tayer" }
]
license = "MIT"
keywords = [
  "hydrology",
  "rainfall",
  "seasonality",
  "wet-dry-seasons",
  "hydrological-year",
  "water-resources",
  "climate-data",
  "chirps",
  "era5",
  "silo",
  "geospatial"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "plotly>=5.0"
]

[project.optional-dependencies]
fetch = [
  "xarray>=2023.8",
  "dask>=2023.8",
  "zarr>=2.16",
  "geopandas>=0.14",
  "rasterio>=1.3",
  "gcsfs>=2023.6",
  "netCDF4>=1.6",
  "pyarrow>=12"
]
all = [
  "xarray>=2023.8",
  "dask>=2023.8",
  "zarr>=2.16",
  "geopandas>=0.14",
  "rasterio>=1.3",
  "gcsfs>=2023.6",
  "netCDF4>=1.6",
  "pyarrow>=12"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[project.urls]
Homepage = "https://github.com/tayerthiaggo/hydroseason"
Documentation = "https://tayerthiaggo.github.io/hydroseason/"
Repository = "https://github.com/tayerthiaggo/hydroseason"
Issues = "https://github.com/tayerthiaggo/hydroseason/issues"
Changelog = "https://github.com/tayerthiaggo/hydroseason/blob/main/CHANGELOG.md"

[project.scripts]
hydroseason = "hydroseason.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["hydroseason*"]

[tool.setuptools.package-data]
hydroseason = ["data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is enforced loosely; long docstrings are fine
