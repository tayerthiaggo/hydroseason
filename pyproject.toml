[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroseason"
version = "0.1.0"
description = "Data-driven hydrological season and year delineation from monthly time series"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Thiaggo Tayer" }
]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "plotly>=5.0",
  "ipython>=8.0"
]

[project.optional-dependencies]
fetch = [
  "xarray>=2023.8",
  "dask>=2023.8",
  "zarr>=2.16",
  "geopandas>=0.14",
  "rasterio>=1.3",
  "gcsfs>=2023.6",
  "netCDF4>=1.6",
  "pyarrow>=12"
]
plot-static = [
  "matplotlib>=3.7",
  "kaleido>=0.2"
]
all = [
  "xarray>=2023.8",
  "dask>=2023.8",
  "zarr>=2.16",
  "geopandas>=0.14",
  "rasterio>=1.3",
  "gcsfs>=2023.6",
  "netCDF4>=1.6",
  "pyarrow>=12",
  "matplotlib>=3.7",
  "kaleido>=0.2"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[project.scripts]
hydroseason = "hydroseason.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["hydroseason*"]

[tool.setuptools.package-data]
hydroseason = ["data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
