[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroseason"
version = "0.1.0"
description = "Remote-sensing-first hydro-year detection from monthly surface-water extent"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Thiaggo Tayer" }
]
license = "MIT"
keywords = [
  "hydrology",
  "hydrological-year",
  "remote-sensing",
  "surface-water",
  "water-mask",
  "water-resources",
  "geospatial"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24"
]

[project.optional-dependencies]
raster = [
  "xarray>=2023.8",
  "rioxarray>=0.15",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "affine>=2.4",
  "dask[array]>=2024.1",
  "zarr>=2.16,<3"
]
stac = [
  "hydroseason[raster]",
  "pystac-client>=0.8",
  "odc-stac>=0.3"
]
all = [
  "hydroseason[raster,stac]"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[project.urls]
Homepage = "https://github.com/tayerthiaggo/hydroseason"
Documentation = "https://tayerthiaggo.github.io/hydroseason/"
Repository = "https://github.com/tayerthiaggo/hydroseason"
Issues = "https://github.com/tayerthiaggo/hydroseason/issues"
Changelog = "https://github.com/tayerthiaggo/hydroseason/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["hydroseason*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: integration or data-backed checks",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
