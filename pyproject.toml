[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroseason"
version = "0.1.0"
description = "Remote-sensing-first hydro-year detection from monthly surface-water extent"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Thiaggo C. Tayer", email = "thiaggo.tayer@uwa.edu.au" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "hydrology",
  "hydrological-year",
  "remote-sensing",
  "surface-water",
  "water-mask",
  "water-resources",
  "geospatial"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24"
]

[project.optional-dependencies]
raster = [
  "xarray>=2023.8",
  "rioxarray>=0.15",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "affine>=2.4",
  "dask[array]>=2024.1",
  "zarr>=2.16,<3",
  "h5netcdf>=1.3",
  "h5py>=3.10",
  "s3fs>=2024.6"
]
stac = [
  "hydroseason[raster]",
  "pystac-client>=0.8",
  "odc-stac>=0.5",
  "tqdm>=4.65"
]
all = [
  "hydroseason[raster,stac]"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12,<1",
  "build>=1.2",
  "twine>=6.1",
  "check-wheel-contents>=0.6",
]

[project.urls]
Homepage = "https://github.com/tayerthiaggo/hydroseason"
Documentation = "https://tayerthiaggo.github.io/hydroseason/"
Repository = "https://github.com/tayerthiaggo/hydroseason"
Issues = "https://github.com/tayerthiaggo/hydroseason/issues"
Changelog = "https://github.com/tayerthiaggo/hydroseason/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
hydroseason = ["_assets/*.js", "_assets/*.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hydroseason*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The promotion-gate harness is documented as "intentionally allowed to fail"
# and must never block a release, but declaring the marker alone did not stop
# it running. Exclude it by default; run it deliberately with `-m experimental`.
addopts = ["-m", "not experimental"]
markers = [
  "slow: integration or data-backed checks",
  "experimental: promotion-gate comparison, may fail without blocking release",
  "network: requires external DEA/STAC access",
  "performance: opt-in wall-clock performance gate",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
