site_name: HydroSeason
site_description: Open-source Python package for testing surface-water seasonality, defining hydrological years, and analysing flood events and dry spells from satellite-derived monthly water extent
site_url: https://tayerthiaggo.github.io/hydroseason/
repo_url: https://github.com/tayerthiaggo/hydroseason
repo_name: tayerthiaggo/hydroseason

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: teal

nav:
  - Home: index.md
  - Usage Guide: guide.md
  - Dynamic Hydrological State: hydrological-state.md
  - Case Studies:
      - Overview: case-studies/index.md
      - Main Catchment Workflow: case-studies/main-workflow.md
      - Resolution and Acquisition: case-studies/resolution-and-acquisition.md
      - Rainfall Context: case-studies/rainfall-context.md
  - Export Columns: report-columns.md
  - API Reference:
      - Overview: api/index.md
      - Workflow: api/workflow.md
      - Loading Data: api/io.md
      - Analysis: api/analysis.md
      - Reporting: api/report.md
  - Citation: citation.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            members_order: source
            show_source: false
            docstring_style: numpy
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences

exclude_docs: |
  plans/**
  superpowers/**
