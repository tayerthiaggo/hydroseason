name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        env:
          OMP_NUM_THREADS: "1"
        run: python -m pytest -q -m "not experimental" --cov=hydroseason --cov-report=term-missing

  test-raster-extras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with raster/stac/dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[raster,stac,dev]"

      - name: Run test suite with raster/STAC dependencies present
        env:
          OMP_NUM_THREADS: "1"
        run: python -m pytest -q -m "not experimental"
