name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact commit SHA or tag to build and publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version and validate release metadata
        id: version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python scripts/check_release_metadata.py --tag "v$VERSION" --require-released

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run lint
        run: python -m ruff check hydroseason tests scripts

      - name: Install uv and check lockfile
        run: |
          python -m pip install --upgrade uv
          uv lock --check

      - name: Run core test suite with coverage
        env:
          OMP_NUM_THREADS: "1"
        run: python -m pytest -q -m "not experimental and not network and not performance" --cov=hydroseason --cov-report=term-missing --cov-fail-under=80

      - name: Install docs dependencies and build strictly
        run: |
          python -m pip install -e ".[all,docs]"
          python scripts/prepare_case_study_data.py --check
          python scripts/_build_study_case_offline.py --check
          python scripts/_build_study_case_rainfall.py --check
          python scripts/run_resolution_case_study.py --check --output-dir case_studies/results/resolution
          python scripts/render_case_study_docs.py --check
          python -m mkdocs build --strict

      - name: Install build tooling
        run: python -m pip install --upgrade build twine check-wheel-contents

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata and wheel contents
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hydroseason
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1; GHCR image published
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test:
    name: Install from TestPyPI and smoke test
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install from TestPyPI with PyPI dependency fallback
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "hydroseason==${{ needs.build.outputs.version }}"

      - name: Checkout notebook fixtures from exact candidate ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Execute notebook against installed TestPyPI candidate
        env:
          HYDROSEASON_RUN_LIVE_DEA: "0"
        run: |
          python -m pip install nbformat nbclient ipykernel
          python scripts/check_notebook_05.py

      - name: CSV analysis and report smoke
        run: |
          python -c "
          import hydroseason
          assert hydroseason.__version__ == '${{ needs.build.outputs.version }}', hydroseason.__version__
          import pandas as pd
          from hydroseason import analyze_catchment
          idx = pd.date_range('2020-01-01', periods=24, freq='MS')
          extent = pd.DataFrame({'extent_pct': [10.0 + (i % 12) for i in range(24)], 'invalid_pct': [0.0] * 24}, index=idx)
          analysis = analyze_catchment(extent, phase_model='rule_based')
          assert analysis is not None
          print('TestPyPI CSV/report smoke OK')
          "

      - name: DEA/cache surface no-network smoke
        run: |
          python -m pip install "hydroseason[all]==${{ needs.build.outputs.version }}" \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/
          python -c "
          from hydroseason import (
              open_wo_statistics,
              acquire_wofs_cache,
              open_completed_mask_cache,
              open_completed_dual_extent_counts,
              verify_cache_footprints,
              generate_catchment_report,
              CatchmentReportPaths,
          )
          print('TestPyPI DEA/cache surface smoke OK')
          "
