name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version and validate release metadata
        id: version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python scripts/check_release_metadata.py --tag "v$VERSION" --require-released

      - name: Verify release tag matches published tag
        if: github.event_name == 'release'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match pyproject.toml version v$VERSION" >&2
            exit 1
          fi

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run lint
        run: python -m ruff check hydroseason tests scripts

      - name: Install uv and check lockfile
        run: |
          python -m pip install --upgrade uv
          uv lock --check

      - name: Run core test suite with coverage
        env:
          OMP_NUM_THREADS: "1"
        run: python -m pytest -q -m "not experimental and not network and not performance" --cov=hydroseason --cov-report=term-missing --cov-fail-under=80

      - name: Install docs dependencies and build strictly
        run: |
          python -m pip install -e ".[all,docs]"
          python scripts/prepare_case_study_data.py --check
          python scripts/_build_study_case_offline.py --check
          python scripts/_build_study_case_rainfall.py --check
          python scripts/run_resolution_case_study.py --check --output-dir case_studies/results/resolution
          python scripts/render_case_study_docs.py --check
          python -m mkdocs build --strict

      - name: Install build tooling
        run: python -m pip install --upgrade build twine check-wheel-contents

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata and wheel contents
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - name: Build case-studies archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          zip -r "dist/hydroseason-$VERSION-case-studies.zip" case_studies/results docs/case-studies

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hydroseason
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - name: Remove non-distribution files before publish
        run: rm -f dist/*-case-studies.zip

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2

  upload-release-assets:
    name: Upload identical dist files to GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'release'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - name: Upload dist files and case-studies archive to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"
